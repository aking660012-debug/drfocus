name: Build DrFocus 1.4 Personal

on:
  push:
    branches: [ "v14-device-controls" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download verified DrFocus 1.3 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9102255067/zip" \
            -o v13-artifact.zip
          unzip -t v13-artifact.zip
          mkdir base-artifact
          unzip -q v13-artifact.zip -d base-artifact
          test -f base-artifact/DrFocus-v1.3.0-source.zip
          unzip -t base-artifact/DrFocus-v1.3.0-source.zip
          unzip -q base-artifact/DrFocus-v1.3.0-source.zip
          test -f DrFocus/app/build.gradle.kts

      - name: Apply DrFocus 1.4 strict device controls
        run: python3 v14_transform.py DrFocus

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run Personal unit tests
        working-directory: DrFocus
        run: gradle :app:testPersonalDebugUnitTest --no-daemon --stacktrace

      - name: Build Personal APK
        working-directory: DrFocus
        run: gradle :app:assemblePersonalDebug --no-daemon --stacktrace

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp DrFocus/app/build/outputs/apk/personal/debug/app-personal-debug.apk DrFocus-v1.4.0-personal.apk
          rm -rf DrFocus/app/build
          zip -qr DrFocus-v1.4.0-source.zip DrFocus
          sha256sum DrFocus-v1.4.0-personal.apk DrFocus-v1.4.0-source.zip

      - name: Upload DrFocus 1.4 Personal
        uses: actions/upload-artifact@v4
        with:
          name: DrFocus-v1.4.0-Personal
          path: |
            DrFocus-v1.4.0-personal.apk
            DrFocus-v1.4.0-source.zip
          if-no-files-found: error
          retention-days: 30
