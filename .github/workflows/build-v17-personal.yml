name: Build DrFocus 1.7 Full Bilingual

on:
  push:
    branches: [ "v17-full-bilingual" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download verified DrFocus 1.6 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9109749408/zip" \
            -o v16-artifact.zip
          unzip -t v16-artifact.zip
          mkdir base-artifact
          unzip -q v16-artifact.zip -d base-artifact
          test -f base-artifact/DrFocus-v1.6.0-source.zip
          unzip -q base-artifact/DrFocus-v1.6.0-source.zip
          test -f DrFocus/app/build.gradle.kts

      - name: Apply DrFocus 1.7 full localization patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d v17-full-bilingual.patch.gz.b64 | gzip -d > v17.patch
          patch -p1 -d DrFocus < v17.patch

      - name: Verify deep UI has no unlocalized Arabic-only literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('DrFocus/app/src/main/java/com/drahmed/drfocus/MainActivity.kt')
          bad=[]
          for i,line in enumerate(p.read_text().splitlines(),1):
              if 'L(' in line or 'UiLanguageRuntime.current' in line:
                  continue
              for m in re.finditer(r'"(?:\\.|[^"\\])*"', line):
                  lit=m.group(0)
                  if any('\u0600' <= c <= '\u06ff' for c in lit) and lit != '"العربية"':
                      bad.append((i,lit))
          if bad:
              print('Unlocalized UI literals:', bad[:30])
              raise SystemExit(1)
          print('Deep UI localization scan passed')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run Personal unit tests
        working-directory: DrFocus
        run: gradle :app:testPersonalDebugUnitTest --no-daemon --stacktrace

      - name: Build Personal APK
        working-directory: DrFocus
        run: gradle :app:assemblePersonalDebug --no-daemon --stacktrace

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp DrFocus/app/build/outputs/apk/personal/debug/app-personal-debug.apk DrFocus-v1.7.0-personal.apk
          rm -rf DrFocus/app/build
          zip -qr DrFocus-v1.7.0-source.zip DrFocus
          sha256sum DrFocus-v1.7.0-personal.apk DrFocus-v1.7.0-source.zip | tee DrFocus-v1.7.0-sha256.txt

      - name: Upload DrFocus 1.7 Personal
        uses: actions/upload-artifact@v4
        with:
          name: DrFocus-v1.7.0-Personal-Full-Bilingual
          path: |
            DrFocus-v1.7.0-personal.apk
            DrFocus-v1.7.0-source.zip
            DrFocus-v1.7.0-sha256.txt
          if-no-files-found: error
          retention-days: 30
