name: Build DrFocus 1.5 Personal Web Strict

on:
  push:
    branches: [ "main", "v15-web-strict-overhaul" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download verified DrFocus 1.3 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9102255067/zip" \
            -o v13-artifact.zip
          unzip -t v13-artifact.zip
          mkdir base-artifact
          unzip -q v13-artifact.zip -d base-artifact
          test -f base-artifact/DrFocus-v1.3.0-source.zip
          unzip -t base-artifact/DrFocus-v1.3.0-source.zip
          unzip -q base-artifact/DrFocus-v1.3.0-source.zip
          test -f DrFocus/app/build.gradle.kts

      - name: Reconstruct and apply DrFocus 1.5 transform
        shell: bash
        run: |
          base64 -d v15_transform.py.gz.b64 | gzip -d > v15_transform.py
          python3 -m py_compile v15_transform.py
          python3 v15_transform.py DrFocus

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run Personal unit tests
        working-directory: DrFocus
        run: gradle :app:testPersonalDebugUnitTest --no-daemon --stacktrace

      - name: Build Personal APK
        working-directory: DrFocus
        run: gradle :app:assemblePersonalDebug --no-daemon --stacktrace

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp DrFocus/app/build/outputs/apk/personal/debug/app-personal-debug.apk DrFocus-v1.5.0-personal.apk
          rm -rf DrFocus/app/build
          zip -qr DrFocus-v1.5.0-source.zip DrFocus
          sha256sum DrFocus-v1.5.0-personal.apk DrFocus-v1.5.0-source.zip | tee DrFocus-v1.5.0-sha256.txt

      - name: Upload DrFocus 1.5 Personal
        uses: actions/upload-artifact@v4
        with:
          name: DrFocus-v1.5.0-Personal-Web-Strict
          path: |
            DrFocus-v1.5.0-personal.apk
            DrFocus-v1.5.0-source.zip
            DrFocus-v1.5.0-sha256.txt
          if-no-files-found: error
          retention-days: 30
