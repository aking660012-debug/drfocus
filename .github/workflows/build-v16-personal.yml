name: Build DrFocus 1.6 Bilingual Web Shield

on:
  push:
    branches: [ "v16-bilingual-webshield" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download verified DrFocus 1.5 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9106920007/zip" \
            -o v15-artifact.zip
          unzip -t v15-artifact.zip
          mkdir base-artifact
          unzip -q v15-artifact.zip -d base-artifact
          test -f base-artifact/DrFocus-v1.5.0-source.zip
          unzip -q base-artifact/DrFocus-v1.5.0-source.zip
          test -f DrFocus/app/build.gradle.kts

      - name: Apply DrFocus 1.6 patch
        shell: bash
        run: |
          set -euo pipefail
          cat v16patch.part01.b64 v16patch.part02.b64 v16patch.part03.b64 v16patch.part04.b64 v16patch.part05.b64 v16patch.part06.b64 | base64 -d | gzip -d > v16.patch
          patch -p1 -d DrFocus < v16.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run Personal unit tests
        working-directory: DrFocus
        run: gradle :app:testPersonalDebugUnitTest --no-daemon --stacktrace

      - name: Build Personal APK
        working-directory: DrFocus
        run: gradle :app:assemblePersonalDebug --no-daemon --stacktrace

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp DrFocus/app/build/outputs/apk/personal/debug/app-personal-debug.apk DrFocus-v1.6.0-personal.apk
          rm -rf DrFocus/app/build
          zip -qr DrFocus-v1.6.0-source.zip DrFocus
          sha256sum DrFocus-v1.6.0-personal.apk DrFocus-v1.6.0-source.zip | tee DrFocus-v1.6.0-sha256.txt

      - name: Upload DrFocus 1.6 Personal
        uses: actions/upload-artifact@v4
        with:
          name: DrFocus-v1.6.0-Personal-Bilingual-WebShield
          path: |
            DrFocus-v1.6.0-personal.apk
            DrFocus-v1.6.0-source.zip
            DrFocus-v1.6.0-sha256.txt
          if-no-files-found: error
          retention-days: 30
