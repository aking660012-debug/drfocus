name: Build DrFocus APK

on:
  push:
    branches: [ "main", "v04-core" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct DrFocus 0.4 source
        shell: bash
        run: |
          cat v04.part01.b64 v04.part02.b64 v04.part03.b64 v04.part04.b64 v04.part05.b64 v04.part06.b64 v04.part07.b64 v04.part08.b64 > v04-project.b64
          python3 - <<'PY'
          import base64, pathlib, hashlib
          source = ''.join(pathlib.Path('v04-project.b64').read_text().split())
          data = base64.b64decode(source, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          print('source sha256:', digest)
          assert digest == 'c5d0511484da9366e644368aca1aa42f303d617d347aa13bb1aeb928bc44af78'
          pathlib.Path('DrFocus-v0.4.0-source.zip').write_bytes(data)
          PY
          unzip -t DrFocus-v0.4.0-source.zip
          unzip -q DrFocus-v0.4.0-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        working-directory: DrFocus
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: DrFocus
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp DrFocus/app/build/outputs/apk/debug/app-debug.apk DrFocus-v0.4.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrFocus-v0.4.0-APK
          path: DrFocus-v0.4.0.apk
          if-no-files-found: error
          retention-days: 30
