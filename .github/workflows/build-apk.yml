name: Build DrFocus APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct project archive
        shell: bash
        run: |
          wc -c project.part1.b64 project.part2.b64 project.part3a.b64 project.part3b.b64 project.part4.b64
          cat project.part1.b64 project.part2.b64 project.part3a.b64 project.part3b.b64 project.part4.b64 > project.b64
          python3 - <<'PY'
          import base64, pathlib
          s=''.join(pathlib.Path('project.b64').read_text().split())
          print('combined chars:', len(s))
          data=base64.b64decode(s, validate=True)
          pathlib.Path('DrFocus-project.zip').write_bytes(data)
          print('zip bytes:', len(data))
          PY
          unzip -t DrFocus-project.zip
          unzip -q DrFocus-project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: DrFocus
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp DrFocus/app/build/outputs/apk/debug/app-debug.apk DrFocus-v0.2.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrFocus-APK
          path: DrFocus-v0.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
