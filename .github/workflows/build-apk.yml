name: Build DrFocus APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct project archive
        shell: bash
        run: |
          cat project.part1.b64 project.part2.b64 project.part3.b64 project.part4.b64 > project.b64
          tr -d '\r\n\t ' < project.b64 | base64 --decode --ignore-garbage > DrFocus-project.zip
          unzip -t DrFocus-project.zip
          unzip -q DrFocus-project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: DrFocus
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp DrFocus/app/build/outputs/apk/debug/app-debug.apk DrFocus-v0.2.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrFocus-APK
          path: DrFocus-v0.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
