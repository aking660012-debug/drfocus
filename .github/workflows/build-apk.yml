name: Build DrFocus APK

on:
  push:
    branches: [ "main", "v03-rebuild" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct DrFocus 0.3 source
        shell: bash
        run: |
          cat v03.part1.b64 v03.part2.b64 v03.part3.b64 v03.part4.b64 v03.part5.b64 v03.part6.b64 > v03-project.b64
          python3 - <<'PY'
          import base64, pathlib
          source = ''.join(pathlib.Path('v03-project.b64').read_text().split())
          data = base64.b64decode(source, validate=True)
          pathlib.Path('DrFocus-v0.3.0-source.zip').write_bytes(data)
          PY
          unzip -t DrFocus-v0.3.0-source.zip
          unzip -q DrFocus-v0.3.0-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        working-directory: DrFocus
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: DrFocus
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp DrFocus/app/build/outputs/apk/debug/app-debug.apk DrFocus-v0.3.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrFocus-v0.3.0-APK
          path: DrFocus-v0.3.0.apk
          if-no-files-found: error
          retention-days: 30
