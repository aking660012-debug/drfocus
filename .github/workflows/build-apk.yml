name: Build DrFocus Commercial

on:
  push:
    branches: [ "main", "v10-commercial" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct DrFocus 1.0 source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path

          names = [
              'v10.part01.b64', 'v10.part02.b64', 'v10.part03.b64',
              'v10.tail01.b64', 'v10.tail02.b64', 'v10.tail03.b64', 'v10.tail04.b64'
          ]
          chunks = {n: ''.join(Path(n).read_text().split()) for n in names}
          target = 'aaad3035b3a411773b2bcd525ff1d5596c9d51e89cf3806b62d148100560c766'

          expected_sizes = [8000, 8000, 8000, 16000, 16000, 16000, 13556]
          print('chunk sizes:', [len(chunks[n]) for n in names])

          def try_source(parts):
              source = ''.join(parts)
              try:
                  data = base64.b64decode(source, validate=True)
              except Exception:
                  return None
              return data if hashlib.sha256(data).hexdigest() == target else None

          parts = [chunks[n] for n in names]
          data = try_source(parts)

          # Connector text transport added one character to tail03. Recover only if
          # removing exactly one character produces the cryptographically expected archive.
          if data is None and len(chunks['v10.tail03.b64']) == 16001:
              bad = chunks['v10.tail03.b64']
              for i in range(len(bad)):
                  candidate = bad[:i] + bad[i+1:]
                  candidate_parts = [chunks[n] if n != 'v10.tail03.b64' else candidate for n in names]
                  data = try_source(candidate_parts)
                  if data is not None:
                      print('recovered source by removing transport character at tail03 index', i)
                      break

          assert data is not None, 'Unable to reconstruct exact DrFocus 1.0 source archive'
          digest = hashlib.sha256(data).hexdigest()
          print('source sha256:', digest)
          assert digest == target
          Path('DrFocus-v1.0.0-source.zip').write_bytes(data)
          PY
          unzip -t DrFocus-v1.0.0-source.zip
          unzip -q DrFocus-v1.0.0-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        working-directory: DrFocus
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: DrFocus
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Play release bundle
        working-directory: DrFocus
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Prepare artifacts
        run: |
          cp DrFocus/app/build/outputs/apk/debug/app-debug.apk DrFocus-v1.0.0-debug.apk
          cp DrFocus/app/build/outputs/bundle/release/app-release.aab DrFocus-v1.0.0-release-unsigned.aab

      - name: Upload commercial build
        uses: actions/upload-artifact@v4
        with:
          name: DrFocus-v1.0.0-Commercial
          path: |
            DrFocus-v1.0.0-debug.apk
            DrFocus-v1.0.0-release-unsigned.aab
            DrFocus-v1.0.0-source.zip
            DrFocus/docs/PRIVACY_POLICY.md
            DrFocus/docs/PLAY_CONSOLE_CHECKLIST.md
            DrFocus/docs/STORE_LISTING.md
          if-no-files-found: error
          retention-days: 30
