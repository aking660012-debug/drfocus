name: Build DrFocus 1.2 Overhaul

on:
  push:
    branches: [ "main", "v12-overhaul" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct DrFocus 1.0 source
        shell: bash
        run: |
          cat v10.part01.b64 v10.part02.b64 v10.part03.b64 v10.tail01.b64 v10.tail02.b64 v10.tail03a1.b64 v10.tail03a2.b64 v10.tail03b.b64 v10.tail04.b64 > v10-project.b64
          python3 - <<'PY'
          import base64, pathlib, hashlib
          source = ''.join(pathlib.Path('v10-project.b64').read_text().split())
          assert len(source) == 85556
          data = base64.b64decode(source, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          print('source sha256:', digest)
          assert digest == 'aaad3035b3a411773b2bcd525ff1d5596c9d51e89cf3806b62d148100560c766'
          pathlib.Path('DrFocus-v1.0.0-source.zip').write_bytes(data)
          PY
          unzip -t DrFocus-v1.0.0-source.zip
          unzip -q DrFocus-v1.0.0-source.zip

      - name: Normalize v1.0 generated source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          service = Path('DrFocus/app/src/main/java/com/drahmed/drfocus/service/FocusAccessibilityService.kt')
          s = service.read_text()
          s = s.replace("append('\n')", "append('\\n')")
          service.write_text(s)

          gradle = Path('DrFocus/app/build.gradle.kts')
          g = gradle.read_text()
          fragment_dep = '    implementation("androidx.fragment:fragment-ktx:1.8.9")\n'
          if 'androidx.fragment:fragment-ktx:' not in g:
              anchor = '    implementation("androidx.activity:activity-compose:1.13.0")\n'
              if anchor in g:
                  g = g.replace(anchor, anchor + fragment_dep)
              else:
                  g = g.replace('dependencies {\n', 'dependencies {\n' + fragment_dep)
          gradle.write_text(g)
          PY

      - name: Apply DrFocus 1.1 hardening patch
        shell: bash
        run: |
          cat v11patch.part01.b64 v11patch.part02.b64 v11patch.part03.b64 | base64 -d | gzip -d > v11.patch
          patch -p1 < v11.patch

      - name: Fix v1.1 compile regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('DrFocus/app/src/main/java/com/drahmed/drfocus/MainActivity.kt')
          s = main.read_text()
          s = s.replace(
              'ToggleRow("إطلاق التطبيق", "إظهار شاشة الحظر عند فتح التطبيق", blockLaunch) { blockLaunch = it }',
              'ToggleRow("إطلاق التطبيق", "إظهار شاشة الحظر عند فتح التطبيق", blockLaunch, onChecked = { blockLaunch = it })'
          )
          s = s.replace(
              'ToggleRow("الإشعارات • PRO", "إلغاء إشعارات التطبيق عندما تتحقق القاعدة", blockNotifications) {\n                    if (isPro) blockNotifications = it else onUpgrade()\n                }',
              'ToggleRow("الإشعارات • PRO", "إلغاء إشعارات التطبيق عندما تتحقق القاعدة", blockNotifications, onChecked = {\n                    if (isPro) blockNotifications = it else onUpgrade()\n                })'
          )
          s = s.replace(
              'ToggleRow("احظر داخل النطاق", "أوقفه لتصبح القاعدة للحظر خارج النطاق", blockInside) { blockInside = it }',
              'ToggleRow("احظر داخل النطاق", "أوقفه لتصبح القاعدة للحظر خارج النطاق", blockInside, onChecked = { blockInside = it })'
          )
          main.write_text(s)

          service = Path('DrFocus/app/src/main/java/com/drahmed/drfocus/service/FocusAccessibilityService.kt')
          s = service.read_text().replace(
              'rootInActiveWindow?.let { browserSnapshot(it).second }.orEmpty()',
              'rootInActiveWindow?.let { browserSnapshot(it, pkg).second }.orEmpty()'
          )
          service.write_text(s)
          PY

      - name: Apply DrFocus 1.2 overhaul patch
        shell: bash
        run: |
          cat v12x.part00 v12x.part01 v12x.part02 v12x.part03 v12x.part04 v12x.part05 | base64 -d | gzip -d > v12.patch
          patch -p1 -d DrFocus < v12.patch
          rm -f DrFocus-v1.0.0-source.zip
          zip -qr DrFocus-v1.2.0-source.zip DrFocus
          sha256sum DrFocus-v1.2.0-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run Play unit tests
        working-directory: DrFocus
        run: gradle :app:testPlayDebugUnitTest --no-daemon --stacktrace

      - name: Run Personal unit tests
        working-directory: DrFocus
        run: gradle :app:testPersonalDebugUnitTest --no-daemon --stacktrace

      - name: Build Personal Hardened APK
        working-directory: DrFocus
        run: gradle :app:assemblePersonalDebug --no-daemon --stacktrace

      - name: Build Play debug APK
        working-directory: DrFocus
        run: gradle :app:assemblePlayDebug --no-daemon --stacktrace

      - name: Build Google Play AAB
        working-directory: DrFocus
        run: gradle :app:bundlePlayRelease --no-daemon --stacktrace

      - name: Prepare artifacts
        run: |
          cp DrFocus/app/build/outputs/apk/personal/debug/app-personal-debug.apk DrFocus-v1.2.0-personal-hardened.apk
          cp DrFocus/app/build/outputs/apk/play/debug/app-play-debug.apk DrFocus-v1.2.0-play-debug.apk
          cp DrFocus/app/build/outputs/bundle/playRelease/app-play-release.aab DrFocus-v1.2.0-play-release-unsigned.aab

      - name: Upload DrFocus 1.2 build
        uses: actions/upload-artifact@v4
        with:
          name: DrFocus-v1.2.0-Overhaul
          path: |
            DrFocus-v1.2.0-personal-hardened.apk
            DrFocus-v1.2.0-play-debug.apk
            DrFocus-v1.2.0-play-release-unsigned.aab
            DrFocus-v1.2.0-source.zip
            DrFocus/docs/PRIVACY_POLICY.md
            DrFocus/docs/PLAY_CONSOLE_CHECKLIST.md
            DrFocus/docs/STORE_LISTING.md
          if-no-files-found: error
          retention-days: 30
